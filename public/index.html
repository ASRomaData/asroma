<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8b001b"><link rel="manifest" href="/manifest.json"><title>ASRomaData — Post Match</title><style>*{box-sizing:border-box}body{margin:0;background:#08090b;color:#fff;font-family:Arial,sans-serif}main{width:min(92vw,520px);margin:auto;padding:28px 0}.logo{color:#d9a441;font-weight:900;letter-spacing:.08em}h1{font-size:32px}.card{background:#15171b;border:1px solid #2b2e34;border-radius:20px;padding:20px}.match{font-size:22px;font-weight:800;margin-bottom:18px}.stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #2a2d32}.label{color:#aeb3bb}.value{font-weight:800;text-align:right}.actions{display:grid;gap:12px;margin-top:18px}button{border:0;border-radius:15px;padding:16px;font-size:17px;font-weight:900}.primary{background:#8b001b;color:#fff}.secondary{background:#25282e;color:#fff}button:disabled{opacity:.45}.status{margin-top:14px;min-height:24px;color:#c9cdd3;white-space:pre-wrap;font-size:14px}canvas{display:none}</style></head><body><main><div class="logo">ASROMADATA</div><h1>Post Match</h1><section class="card"><div id="match" class="match">Caricamento…</div><div id="stats"></div><div class="actions"><button id="publish" class="primary" disabled>📣 PUBBLICA OVUNQUE</button><button id="refresh" class="secondary">↻ Aggiorna partita</button></div><div id="status" class="status"></div></section></main><canvas id="canvas" width="1080" height="1080"></canvas><script>
let current=null;const $=id=>document.getElementById(id);const pair=(v,s="")=>(v?.home??"-")+s+" - "+(v?.away??"-")+s;
function render(m){current=m;$("match").textContent=m.homeTeam+" "+m.homeScore+"-"+m.awayScore+" "+m.awayTeam;const s=m.stats;const rows=[["Tiri (nello specchio)",pair(s.shots)+" ("+pair(s.onTarget)+")"],["xG",pair(s.xg)],["xG in porta",pair(s.xgot)],["Possesso",pair(s.possession,"%")],["Precisione",pair(s.passAccuracy,"%")],["Grandi Occasioni",pair(s.bigChances)]];$("stats").innerHTML=rows.map(r=>'<div class="stat"><span class="label">'+r[0]+'</span><span class="value">'+r[1]+'</span></div>').join("");$("publish").disabled=false}
async function load(){$("publish").disabled=true;$("status").textContent="Recupero dati…";try{const r=await fetch("/api/match",{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error||"Errore");render(d);$("status").textContent="Pronto."}catch(e){$("status").textContent="❌ "+e.message}}
function image(m){const c=$("canvas"),x=c.getContext("2d"),s=m.stats;x.fillStyle="#0b0c0f";x.fillRect(0,0,1080,1080);x.fillStyle="#8b001b";x.fillRect(0,0,1080,22);x.fillStyle="#d9a441";x.font="900 36px Arial";x.fillText("ASROMADATA",70,100);x.fillStyle="#fff";x.font="900 48px Arial";x.fillText(m.homeTeam+" "+m.homeScore+"-"+m.awayScore+" "+m.awayTeam,70,180);const rows=[["Tiri (nello specchio)",pair(s.shots)+" ("+pair(s.onTarget)+")"],["xG",pair(s.xg)],["xG in porta",pair(s.xgot)],["Possesso",pair(s.possession,"%")],["Precisione",pair(s.passAccuracy,"%")],["Grandi Occasioni",pair(s.bigChances)]];rows.forEach((r,i)=>{let y=300+i*105;x.fillStyle="#9da3ad";x.font="700 31px Arial";x.fillText(r[0],70,y);x.fillStyle="#fff";x.font="900 34px Arial";x.fillText(r[1],620,y)});return c.toDataURL("image/png")}
$("publish").onclick=async()=>{if(!current)return;$("publish").disabled=true;$("status").textContent="Pubblicazione…";try{let secret=localStorage.getItem("asroma_publish_secret")||prompt("Password di pubblicazione:");if(secret)localStorage.setItem("asroma_publish_secret",secret);const r=await fetch("/api/publish",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(secret||"")},body:JSON.stringify({image:image(current)})}),d=await r.json();if(!r.ok)throw Error(d.error||"Errore");$("status").textContent=(d.results?.x?.ok?"X ✓":"X — non configurato")+"\n"+(d.results?.instagram?.ok?"Instagram ✓":"Instagram — non configurato")}catch(e){$("status").textContent="❌ "+e.message}finally{$("publish").disabled=false}};$("refresh").onclick=load;load();
</script></body></html>
